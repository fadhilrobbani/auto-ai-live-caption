<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <!-- Soundwave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Accent Indicator Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />

  <!-- Glassmorphic Caption Card -->
  <rect x="64" y="96" width="384" height="320" rx="36" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="3" />

  <!-- Top Window Header Dots -->
  <circle cx="106" cy="136" r="8" fill="#ef4444" opacity="0.85" />
  <circle cx="132" cy="136" r="8" fill="#f59e0b" opacity="0.85" />
  <circle cx="158" cy="136" r="8" fill="#10b981" opacity="0.85" />

  <!-- Live Pulse Dot -->
  <circle cx="396" cy="136" r="7" fill="#ef4444" filter="url(#glow)" />

  <!-- Soundwave Audio Bars (Live Audio Ingestion) -->
  <g fill="url(#waveGrad)">
    <rect x="116" y="210" width="16" height="52" rx="8" />
    <rect x="148" y="186" width="16" height="100" rx="8" />
    <rect x="180" y="222" width="16" height="28" rx="8" />
    <rect x="212" y="172" width="16" height="128" rx="8" />
    <rect x="244" y="152" width="16" height="168" rx="8" />
    <rect x="276" y="178" width="16" height="116" rx="8" />
    <rect x="308" y="200" width="16" height="72" rx="8" />
    <rect x="340" y="170" width="16" height="132" rx="8" />
    <rect x="372" y="214" width="16" height="44" rx="8" />
  </g>

  <!-- Live Subtitle Text Indicator Lines (Committed & Tentative) -->
  <rect x="108" y="344" width="160" height="14" rx="7" fill="#ffffff" opacity="0.95" />
  <rect x="282" y="344" width="112" height="14" rx="7" fill="#93c5fd" opacity="0.85" />
  <rect x="108" y="372" width="220" height="14" rx="7" fill="#ffffff" opacity="0.95" />
</svg>
