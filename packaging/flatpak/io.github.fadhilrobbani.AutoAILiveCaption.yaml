app-id: io.github.fadhilrobbani.AutoAILiveCaption
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: auto-ai-live-caption

finish-args:
  # Wayland & X11 fallback
  - --socket=wayland
  - --socket=fallback-x11
  # PulseAudio / PipeWire audio monitoring
  - --socket=pulseaudio
  # Network for model download & cloud Whisper APIs (Groq, OpenAI)
  - --share=network
  - --share=ipc
  - --device=dri
  # Persistent config & model storage permissions
  - --filesystem=xdg-config/auto-ai-live-caption:create
  - --filesystem=xdg-data/models:create

modules:
  # Python Dependencies
  - name: python3-dependencies
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} -r requirements.txt
    sources:
      - type: file
        path: requirements.txt

  # Main Application
  - name: auto-ai-live-caption
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --prefix=${FLATPAK_DEST} .
      # Install Desktop file
      - install -Dm644 packaging/flatpak/io.github.fadhilrobbani.AutoAILiveCaption.desktop ${FLATPAK_DEST}/share/applications/io.github.fadhilrobbani.AutoAILiveCaption.desktop
      # Install AppStream Metainfo
      - install -Dm644 packaging/flatpak/io.github.fadhilrobbani.AutoAILiveCaption.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.fadhilrobbani.AutoAILiveCaption.metainfo.xml
      # Install Application Icons
      - install -Dm644 packaging/assets/io.github.fadhilrobbani.AutoAILiveCaption.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.fadhilrobbani.AutoAILiveCaption.svg
    sources:
      - type: dir
        path: ../../
